name: Update README TOC

# main only. The TOC is generated and committed, so running it on a branch
# would write a commit onto whatever branch happened to be pushed.
on:
  push:
    branches: [main]
    paths:
      - docs/**
  workflow_dispatch:

# Write access is granted only to the job that commits
permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same checks
# twice. Qualified by the repository the branch lives in, since a fork names its
# branches itself: a pull request from a fork's main would otherwise share a
# group with a push to this one and cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mdtoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: .ruby-version

      - name: Install dependencies
        run: gem install mdtoc rake

      - name: Run mdtoc
        run: mdtoc --append --create --output README.md docs/

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "docs: update README TOC"
          file_pattern: "README.md"
