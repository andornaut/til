name: Update README TOC

# main only. The TOC is generated and committed, so running it on a branch
# would write a commit onto whatever branch happened to be pushed.
on:
  push:
    branches: [main]
    paths:
      - docs/**
  workflow_dispatch:

# Write access is granted only to the job that commits
permissions:
  contents: read

# One run at a time per branch. Spelled the same as every other workflow's
# group. Keyed by the event so a manual dispatch and a push to main do not
# cancel each other: this workflow commits, so a cancelled run drops the commit
# rather than only a check. The pull request and fork terms are inert here:
# this one runs on main only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mdtoc:
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # bundler-cache installs from Gemfile.lock, so the gems that generate a
      # committed file are the versions the lockfile names rather than whatever
      # rubygems served that morning.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run mdtoc
        run: bundle exec mdtoc --append --create --output README.md docs/

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "docs: update README TOC"
          file_pattern: "README.md"
