name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # bundler-cache installs from Gemfile.lock, so the gem that generates the
      # table of contents is the version the lockfile names rather than whatever
      # rubygems served that morning.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The table of contents is generated from docs/ and committed, so it can
      # drift from the pages it lists. Checked here rather than regenerated by a
      # workflow that commits: a push to main from a workflow cannot satisfy the
      # checks this branch requires, so the table of contents arrives with the
      # change that moved it. `rake mdtoc` regenerates it, or the command below
      # to regenerate without committing.
      - name: Check that the README TOC is current
        run: |
          set -euo pipefail
          bundle exec mdtoc --append --create --output README.md docs/
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md table of contents is out of date; run 'rake mdtoc' and commit the result"
            git diff -- README.md
            exit 1
          fi
